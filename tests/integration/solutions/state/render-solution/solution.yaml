apiVersion: scafctl.io/v1
kind: Solution

metadata:
  name: test-state-render-solution
  version: 1.0.0
  description: |
    Functional tests for state loading in 'render solution' command.
    Verifies that render loads persisted state into the resolver context
    so the state provider can serve previously saved values. State is
    read-only in render mode -- never saved. The action graph is rendered
    using resolver values that were read from state.

state:
  enabled: true
  backend:
    provider: file
    inputs:
      path: render-state.json

spec:
  resolvers:
    deploy_target:
      description: Deployment target read from state
      type: string
      saveToState: true
      resolve:
        with:
          - provider: state
            onError: continue
            inputs:
              key: "deploy_target"
              required: true
          - provider: static
            inputs:
              value: "default-target"

    app_version:
      description: Application version
      type: string
      saveToState: true
      resolve:
        with:
          - provider: state
            onError: continue
            inputs:
              key: "app_version"
              required: true
          - provider: static
            inputs:
              value: "0.0.1"

  workflow:
    actions:
      deploy:
        description: Deploy action
        provider: exec
        inputs:
          command:
            expr: "'echo deploy ' + _.app_version + ' to ' + _.deploy_target"

  testing:
    config:
      skipBuiltins: [resolve-defaults, render-defaults]

    cases:
      # =====================================================================
      # Render with empty state uses resolver defaults
      # =====================================================================
      render-empty-state:
        description: Render with no state file uses static fallback values
        command: [render, solution]
        args: ["-o", "json"]
        tags: [state, render, smoke]
        env:
          XDG_STATE_HOME: /tmp/scafctl-it-state-rendersol-empty
        init:
          - command: "rm -rf /tmp/scafctl-it-state-rendersol-empty && mkdir -p /tmp/scafctl-it-state-rendersol-empty/scafctl"
        cleanup:
          - command: "rm -rf /tmp/scafctl-it-state-rendersol-empty"
        assertions:
          - expression: __exitCode == 0
          - expression: __output.actions["deploy"].inputs["command"].contains("default-target")
            message: "Render should use static fallback when state is empty"
          - expression: __output.actions["deploy"].inputs["command"].contains("0.0.1")
            message: "Render should use static fallback version"

      # =====================================================================
      # Render with pre-seeded state uses cached values
      # =====================================================================
      render-reads-state:
        description: Render loads pre-seeded state and uses cached values in action graph
        command: [render, solution]
        args: ["-o", "json"]
        tags: [state, render]
        env:
          XDG_STATE_HOME: /tmp/scafctl-it-state-rendersol-preseeded
        init:
          - command: "rm -rf /tmp/scafctl-it-state-rendersol-preseeded && mkdir -p /tmp/scafctl-it-state-rendersol-preseeded/scafctl"
          - command: >-
              printf '{"schemaVersion":1,"metadata":{"solution":"test-state-render-solution","version":"1.0.0","createdAt":"2025-01-01T00:00:00Z","lastUpdatedAt":"2025-01-01T00:00:00Z","scafctlVersion":"dev"},"command":{"subcommand":"render solution","parameters":{}},"values":{"deploy_target":{"value":"prod-cluster","type":"string","updatedAt":"2025-01-01T00:00:00Z","immutable":false},"app_version":{"value":"3.2.1","type":"string","updatedAt":"2025-01-01T00:00:00Z","immutable":false}}}'
              > /tmp/scafctl-it-state-rendersol-preseeded/scafctl/render-state.json
        cleanup:
          - command: "rm -rf /tmp/scafctl-it-state-rendersol-preseeded"
        assertions:
          - expression: __exitCode == 0
          - expression: __output.actions["deploy"].inputs["command"].contains("prod-cluster")
            message: "Render should use deploy_target from state"
          - expression: __output.actions["deploy"].inputs["command"].contains("3.2.1")
            message: "Render should use app_version from state"

      # =====================================================================
      # Render does NOT write state (read-only)
      # =====================================================================
      render-no-state-write:
        description: Render does not create a state file (read-only mode)
        command: [render, solution]
        args: ["-o", "json"]
        tags: [state, render, readonly]
        env:
          XDG_STATE_HOME: /tmp/scafctl-it-state-rendersol-nowrite
        init:
          - command: "rm -rf /tmp/scafctl-it-state-rendersol-nowrite && mkdir -p /tmp/scafctl-it-state-rendersol-nowrite/scafctl"
        cleanup:
          - command: "rm -rf /tmp/scafctl-it-state-rendersol-nowrite"
        assertions:
          - expression: __exitCode == 0

      # =====================================================================
      # Render with parameter and state (param wins in resolver chain)
      # =====================================================================
      render-param-with-state:
        description: CLI parameter overrides state in render mode
        command: [render, solution]
        args: ["-o", "json", "-r", "target=edge"]
        tags: [state, render]
        env:
          XDG_STATE_HOME: /tmp/scafctl-it-state-rendersol-param
        init:
          - command: "rm -rf /tmp/scafctl-it-state-rendersol-param && mkdir -p /tmp/scafctl-it-state-rendersol-param/scafctl"
          - command: >-
              printf '{"schemaVersion":1,"metadata":{"solution":"test-state-render-solution","version":"1.0.0","createdAt":"2025-01-01T00:00:00Z","lastUpdatedAt":"2025-01-01T00:00:00Z","scafctlVersion":"dev"},"command":{"subcommand":"render solution","parameters":{}},"values":{"deploy_target":{"value":"cached-target","type":"string","updatedAt":"2025-01-01T00:00:00Z","immutable":false}}}'
              > /tmp/scafctl-it-state-rendersol-param/scafctl/render-state.json
        cleanup:
          - command: "rm -rf /tmp/scafctl-it-state-rendersol-param"
        assertions:
          - expression: __exitCode == 0
          # State wins since it's first in the chain (required: true succeeds)
          - expression: __output.actions["deploy"].inputs["command"].contains("cached-target")
            message: "State provider is first in chain, so state value wins when present"
